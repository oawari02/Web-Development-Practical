<!DOCTYPE html>
<html lang="en">
<head>
    <title>Suggest a Technology</title>
</head>
<body>
    <h1>Suggest a Technology</h1>
    <p>
        USe the followingform to suggest an emerging technology that can be added to the portal.
    </p>
    <form>
        <label>Technology Name:</label>
        <input type="text" name="technology">
        <br><br>

        <label>Organisation Name:</label><br>
        <input type="text" name="organisation">
        <br><br>

        <label>Technology Category:</label><br>
        <select name="Category">
            <option>Artificial Intelligence</option>
            <option>Blockchain</option>
            <option>Internet of Things</option>
            <option>Cloud Computing</option>
            <option>Cyber Security</option>
            <option>Augmented Reality</option>
            <option>Virtual Reality</option>
        </select>
        <br><br>
        <label>Description:</label>
        <textarea name="description" rows="6" cols="50"></textarea>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
